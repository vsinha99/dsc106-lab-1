<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact Varun Sinha by email.">
    <title>Contact | Varun Sinha</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <span class="site-name">Varun Sinha</span>
        <nav class="site-nav" aria-label="Main navigation"></nav>
      </div>
    </header>

    <main id="main" class="shell page-main contact-layout">
      <div class="page-intro">
        <p class="eyebrow">Get in touch</p>
        <h1>Contact</h1>
        <p class="lead">Send me an email about a project, research, or an opportunity.</p>
        <p class="contact-address">Email directly: <a href="mailto:varuns0906@gmail.com">varuns0906@gmail.com</a></p>
      </div>

      <form class="contact-form" action="mailto:varuns0906@gmail.com" method="POST" enctype="text/plain">
        <label class="field" for="email">
          <span>Your email</span>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <label class="field" for="subject">
          <span>Subject</span>
          <input id="subject" name="subject" type="text" required>
        </label>
        <label class="field" for="message">
          <span>Message</span>
          <textarea id="message" name="message" rows="7" required></textarea>
        </label>
        <button class="button" type="submit">Open email draft <span aria-hidden="true">→</span></button>
        <p class="form-note">Submitting opens your default email app with the form contents.</p>
      </form>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>Varun Sinha · UC San Diego</p>
        <a href="mailto:varuns0906@gmail.com">varuns0906@gmail.com</a>
      </div>
    </footer>
    <script type="module" src="../global.js"></script>
  </body>
</html>
